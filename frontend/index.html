<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Footprint Analyzer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Digital Footprint Analyzer</h1>
    <p>Analyze your online presence securely</p>
</header>

<main class="container">

    <!-- HERO SECTION -->
    <section class="card">

        <div class="hero">
            <h2>Check Your Digital Risk</h2>

            <form id="searchForm" class="search-box">

                <input 
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required
                >

                <button type="submit">
                    Analyze
                </button>

            </form>

        </div>

    </section>

    <!-- FEATURES SECTION -->
    <section class="card features">

        <h2>Features</h2>

        <ul>
            <li>✔ Social Media Risk Analysis</li>
            <li>✔ Data Leak Detection</li>
            <li>✔ Search Visibility Check</li>
            <li>✔ Security Score Report</li>
        </ul>

    </section>

</main>

<footer>
    <p>Digital Footprint Analyzer © 2026</p>
</footer>

<script src="js/main.js"></script>

</body>

</html>
